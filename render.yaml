# Render Blueprint (STAGING, from the `staging` branch): the API, the worker and Redis, in Frankfurt (the closest Render region to Senegal).
# MongoDB is on MongoDB Atlas (same region: AWS eu-central-1); pictures on Cloudflare R2.
# Values marked `sync: false` are asked for when the Blueprint is created, and never stored in this file.
#
# This is the STAGING setup: test OTP codes (1234), SMS written to the log, simulated payments.
# For the students' server: STAGING=false, OTP_DEV_MODE=false, a real SMS_PROVIDER, PAYMENTS_SIMULATOR=false.

services:
  - type: web
    name: ugb-connect-api-staging
    runtime: docker
    repo: https://github.com/Magueye717/ugb-connect-backend
    branch: staging
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/main.js api
    # Collections, validators, indexes and data migrations, before the new version takes traffic.
    preDeployCommand: node dist/main.js migrate
    # Ready = MongoDB and Redis answer.
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - fromGroup: ugb-connect-backend-staging
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ugb-connect-redis-staging
          property: connectionString

  - type: worker
    name: ugb-connect-worker-staging
    runtime: docker
    repo: https://github.com/Magueye717/ugb-connect-backend
    branch: staging
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/main.js worker
    autoDeploy: true
    envVars:
      - fromGroup: ugb-connect-backend-staging
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ugb-connect-redis-staging
          property: connectionString

  # Queues (BullMQ) and rate limits. Paid plan: kept on disk across restarts. `noeviction`: a full Redis refuses new
  # jobs instead of silently dropping queued ones.
  - type: keyvalue
    name: ugb-connect-redis-staging
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    # Reachable only from this Render account's services.
    ipAllowList: []

envVarGroups:
  - name: ugb-connect-backend-staging
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAGING
        value: true
      - key: LOG_LEVEL
        value: info
      # Behind Render's proxy: real client IPs for rate limits, https links.
      - key: TRUST_PROXY
        value: true
      # Swagger on /docs: the temporary back office (Q-12).
      - key: DOCS_ENABLED
        value: true

      # Atlas cluster `ugbconnect`: mongodb+srv://USER:PASSWORD@ugbconnect.xxxxx.mongodb.net/?retryWrites=true&w=majority
      # (no database in the path: MONGODB_DB names it; a password with @ : / ? # % must be URL-encoded).
      - key: MONGODB_URI
        sync: false
      # The first administrator: created by the pre-deploy step if no account uses this phone, never changed after.
      - key: BOOTSTRAP_ADMIN_PHONE
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Must match the Atlas database name exactly (production: ugb_connect).
      - key: MONGODB_DB
        value: ugb_connect_staging
      - key: REDIS_PREFIX
        value: ugb

      # `npm run keys` prints a pair: paste both.
      - key: JWT_KID
        value: prod-1
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: OTP_PEPPER
        generateValue: true
      - key: SIMULATOR_WEBHOOK_SECRET
        generateValue: true

      # Staging only (see the top of this file).
      - key: OTP_DEV_MODE
        value: true
      - key: SMS_PROVIDER
        value: console
      - key: PAYMENTS_SIMULATOR
        value: true

      - key: PUSH_PROVIDER
        value: expo

      # Cloudflare R2: a token and bucket for this server, not the development ones.
      - key: MEDIA_STORAGE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: ugb-connect-media-staging
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false
